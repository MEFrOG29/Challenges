<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <div class="card">
      <div class="card__picture"></div>
      <p class="card__type">Learning</p>
      <p class="card__publish-date">Published 21 Dec 2023</p>
      <p class="card__title">HTML & CSS foundations</p>
      <p class="card__description">
        These languages are the backbone of every website, defining structure,
        content, and presentation.
      </p>
      <div class="card__author">
        <img
          src="./assets/images/image-avatar.webp"
          alt="avatar"
          class="card__author-logo"
        />
        <p class="card__author-name">Greg Hooper</p>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/MEFrOG29">mefrog29</a>.
    </footer>
  </body>
</html>
